[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-server"
version = "0.1.0"
description = "PULSE Server with Integrated Virtual Container Dataset Generation Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "msgpack>=1.0.8",
    "psutil>=5.9.0",
    "redis>=5.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
include = ["api*", "Server*", "vdc*", "ml*", "datasets_hub*"]
namespaces = true

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["Server/tests", "ml/tests"]
pythonpath = ["Server/src", "."]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async coroutine",
]
addopts = "-v"
