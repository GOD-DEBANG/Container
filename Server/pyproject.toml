[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-server"
version = "0.1.0"
description = "PULSE Server with Integrated Virtual Container Dataset Generation Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PULSE Core Engineering Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "msgpack>=1.0.8",
    "psutil>=5.9.0",
    "redis>=5.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src", ".."]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async coroutine",
]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.vercel]
entrypoint = "api.index:app"
